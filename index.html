<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blooket Landing</title>
    <style>
      :root {
        --page-bg: #ebebeb;
        --brand: #52d6ee;
        --brand-deep: #38c8e6;
        --button-green: #6ad4e7;
        --button-tint: #99ecf7;
        --text: #2d2d2d;
        --muted: #5d5d5d;
        --panel-cream: #f4e1a0;
        --panel-brown: #8f5b2c;
        --desk-brown: #b07a4a;
        --desk-dark: #7a4d2b;
        --board-bg: #f6f6f6;
        --tile-1: #29a4d5;
        --tile-2: #f27d5d;
        --tile-3: #61d47b;
        --tile-4: #f6d54c;
        --tile-5: #8e77ff;
        --tile-6: #ec7fbd;
        --yellow: #f1d955;
        --yellow-deep: #f7b940;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: var(--page-bg);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }

      .page {
        width: 100%;
        max-width: 1500px;
        min-height: 100vh;
        padding: 18px 42px 24px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 18px 0 12px;
      }

      .logo {
        width: 290px;
        height: 72px;
        border-radius: 14px 14px 18px 18px;
        background: linear-gradient(180deg, var(--brand) 0%, var(--brand-deep) 100%);
        box-shadow: inset 0 -5px 0 rgba(24, 103, 122, 0.12), 0 3px 0 rgba(112, 112, 112, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: clamp(2.5rem, 3vw, 4rem);
        line-height: 1;
        color: white;
        text-shadow: 0 3px 0 rgba(0,0,0,0.08);
        letter-spacing: -0.06em;
        padding-top: 4px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 4px;
      }

      .btn {
        border: none;
        border-radius: 14px;
        font-weight: 800;
        cursor: pointer;
        font-family: inherit;
      }

      .join-btn,
      .login-btn {
        min-width: 168px;
        height: 62px;
        padding: 0 26px;
        background: rgba(255,255,255,0.14);
        border: 2px solid rgba(165, 165, 165, 0.32);
        color: #2e2e2e;
        font-size: 1.1rem;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
      }

      .join-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .join-btn .play {
        display: inline-block;
        width: 0;
        height: 0;
        border-left: 13px solid #2d2d2d;
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        margin-right: 12px;
      }

      .hero {
        margin-top: 70px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 58px;
      }

      .left-scene {
        position: relative;
        width: 340px;
        height: 240px;
        margin-left: -10px;
      }

      .board-shadow {
        position: absolute;
        left: 34px;
        bottom: 8px;
        width: 270px;
        height: 160px;
        background: rgba(0,0,0,0.08);
        filter: blur(5px);
        border-radius: 30px;
      }

      .board {
        position: absolute;
        left: 18px;
        bottom: 18px;
        width: 260px;
        height: 150px;
        background: #f7f3ea;
        border: 8px solid #d9a76d;
        border-radius: 10px 10px 14px 14px;
        box-shadow: inset 0 0 0 4px rgba(153, 104, 47, 0.24);
      }

      .board::before {
        content: "";
        position: absolute;
        left: 30px;
        top: 28px;
        width: 170px;
        height: 28px;
        background: rgba(0,0,0,0.08);
        border-radius: 6px;
      }

      .board::after {
        content: "";
        position: absolute;
        left: 22px;
        right: 20px;
        top: 64px;
        bottom: 18px;
        background: linear-gradient(
          to right,
          rgba(255,255,255,0.3) 0,
          rgba(255,255,255,0.3) 20%,
          transparent 20%,
          transparent 48%,
          rgba(255,255,255,0.25) 48%,
          rgba(255,255,255,0.25) 52%,
          transparent 52%,
          transparent 100%
        );
        border-radius: 8px;
      }

      .menu-strip {
        position: absolute;
        left: 54px;
        top: 18px;
        width: 150px;
        height: 18px;
        background: linear-gradient(90deg, #e9d2a4, #e3c284 55%, #d7a669);
        border-radius: 6px 6px 0 0;
      }

      .menu-strip::before,
      .menu-strip::after {
        content: "";
        position: absolute;
        left: 18px;
        top: 5px;
        width: 90px;
        height: 4px;
        background: rgba(68, 48, 21, 0.65);
        border-radius: 3px;
      }

      .menu-strip::after {
        top: 12px;
        width: 70px;
      }

      .board-tiles {
        position: absolute;
        left: 32px;
        right: 28px;
        top: 68px;
        height: 58px;
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }

      .tile {
        flex: 1;
        height: 58px;
        border-radius: 3px;
      }

      .tile:nth-child(1) { background: #28a3d9; }
      .tile:nth-child(2) { background: #66d57a; }
      .tile:nth-child(3) { background: #ff7f5e; }
      .tile:nth-child(4) { background: #f7d857; }
      .tile:nth-child(5) { background: #8d78fd; }

      .teacher {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 115px;
        height: 105px;
      }

      .teacher .head {
        position: absolute;
        left: 18px;
        top: 10px;
        width: 66px;
        height: 52px;
        background: #a5693d;
        border-radius: 48% 48% 46% 46%;
        z-index: 2;
        border: 2px solid rgba(101, 59, 29, 0.72);
      }

      .teacher .head::before,
      .teacher .head::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        background: #fff;
        border-radius: 50%;
        top: 18px;
        left: 14px;
        box-shadow: 23px 0 0 #fff;
      }

      .teacher .head::after {
        width: 8px;
        height: 8px;
        top: 21px;
        left: 18px;
        box-shadow: 23px 0 0 #111;
        background: #111;
      }

      .teacher .hat {
        position: absolute;
        left: 16px;
        top: -5px;
        width: 64px;
        height: 22px;
        background: #b87b38;
        border-radius: 14px 14px 10px 10px;
        border: 2px solid rgba(75, 48, 19, 0.75);
        z-index: 3;
      }

      .teacher .hat::before {
        content: "";
        position: absolute;
        left: 10px;
        top: -10px;
        width: 34px;
        height: 18px;
        background: #d4a45f;
        border-radius: 12px 12px 0 0;
        border: 2px solid rgba(75, 48, 19, 0.75);
      }

      .teacher .body {
        position: absolute;
        left: 8px;
        bottom: 0;
        width: 86px;
        height: 56px;
        background: #9d5a2c;
        border-radius: 26px 26px 26px 20px;
        border: 3px solid rgba(79, 42, 19, 0.7);
      }

      .teacher .body::before {
        content: "";
        position: absolute;
        left: 12px;
        top: 10px;
        width: 48px;
        height: 24px;
        background: rgba(255,255,255,0.14);
        border-radius: 15px;
      }

      .teacher .arm {
        position: absolute;
        left: 70px;
        bottom: 18px;
        width: 26px;
        height: 70px;
        background: #a76d41;
        border-radius: 18px;
        transform: rotate(24deg);
      }

      .teacher .arm::after {
        content: "";
        position: absolute;
        left: -10px;
        top: 36px;
        width: 20px;
        height: 14px;
        background: #a76d41;
        border-radius: 10px;
      }

      .teacher .glasses {
        position: absolute;
        left: 45px;
        top: 30px;
        width: 14px;
        height: 10px;
        border: 3px solid #3d3d3d;
        border-radius: 6px;
        z-index: 4;
        box-shadow: 18px 0 0 -3px #3d3d3d;
      }

      .center-copy {
        width: 440px;
        text-align: center;
      }

      .headline {
        margin: 0;
        font-size: clamp(2.3rem, 2.3vw, 4.3rem);
        line-height: 1.06;
        letter-spacing: -0.04em;
        font-weight: 900;
        color: #2e2e2e;
      }

      .signup-btn {
        margin-top: 24px;
        width: 100%;
        max-width: 340px;
        height: 74px;
        background: linear-gradient(180deg, #5ad4ec 0%, #43c7e8 100%);
        color: white;
        font-size: clamp(1.2rem, 1.6vw, 2.1rem);
        font-weight: 900;
        border-radius: 16px;
        border: none;
        box-shadow: inset 0 -4px 0 rgba(26, 104, 128, 0.2);
      }

      .pronounced {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 1.28rem;
        color: rgba(26, 26, 26, 0.75);
        font-weight: 600;
      }

      .pronounced .speaker {
        position: relative;
        width: 15px;
        height: 15px;
      }

      .pronounced .speaker::before,
      .pronounced .speaker::after {
        content: "";
        position: absolute;
      }

      .pronounced .speaker::before {
        left: 0;
        top: 2px;
        width: 6px;
        height: 8px;
        background: #2d2d2d;
        border-radius: 2px 0 0 2px;
      }

      .pronounced .speaker::after {
        right: 0;
        top: 0;
        width: 11px;
        height: 11px;
        border: 2px solid rgba(0,0,0,0.7);
        border-left: none;
        border-radius: 0 60% 60% 0;
        transform: rotate(12deg);
      }

      .right-scene {
        position: relative;
        width: 430px;
        height: 200px;
        margin-left: -10px;
      }

      .desk {
        position: absolute;
        left: 16px;
        right: 8px;
        bottom: 0;
        height: 62px;
        background: linear-gradient(180deg, #b17d53 0%, #8d6038 100%);
        border-radius: 12px 12px 0 0;
        box-shadow: inset 0 10px 0 rgba(255,255,255,0.12);
      }

      .desk::before,
      .desk::after {
        content: "";
        position: absolute;
        top: -10px;
        width: 18px;
        height: 18px;
        background: rgba(255,255,255,0.2);
        border-radius: 4px;
      }

      .desk::before { left: 24px; }
      .desk::after { right: 28px; }

      .blook-row {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 48px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 12px;
      }

      .blook {
        position: relative;
        width: 70px;
        height: 80px;
      }

      .blook .body {
        position: absolute;
        left: 8px;
        bottom: 0;
        width: 54px;
        height: 50px;
        background: #f7d64f;
        border-radius: 10px 10px 16px 16px;
        border: 2px solid rgba(204, 162, 31, 0.8);
        box-shadow: inset 0 -7px 0 rgba(232, 184, 43, 0.2);
      }

      .blook .body::before {
        content: "";
        position: absolute;
        left: 10px;
        right: 10px;
        top: 15px;
        height: 13px;
        border-radius: 8px;
        background: rgba(255,255,255,0.38);
      }

      .blook .face {
        position: absolute;
        left: 10px;
        right: 10px;
        top: 6px;
        height: 30px;
        border-radius: 12px;
        background: #f4cf59;
      }

      .blook .eye {
        position: absolute;
        top: 16px;
        width: 8px;
        height: 8px;
        background: #222;
        border-radius: 50%;
      }

      .blook .eye.left { left: 22px; }
      .blook .eye.right { right: 22px; }

      .blook .smile {
        position: absolute;
        left: 24px;
        bottom: 18px;
        width: 18px;
        height: 9px;
        border-bottom: 3px solid #222;
        border-radius: 0 0 12px 12px;
      }

      .blook:nth-child(2) .body { background: #f6d857; }
      .blook:nth-child(3) .body { background: #e7c64d; }
      .blook:nth-child(4) .body { background: #f7d365; }
      .blook:nth-child(5) .body { background: #f5ce5e; }

      .scroll-cue {
        display: flex;
        justify-content: center;
        margin-top: 48px;
      }

      .scroll-cue .arrow {
        width: 24px;
        height: 24px;
        border-left: 4px solid rgba(44, 44, 44, 0.7);
        border-bottom: 4px solid rgba(44, 44, 44, 0.7);
        transform: rotate(-45deg);
      }

      @media (max-width: 1200px) {
        .page {
          padding-left: 22px;
          padding-right: 22px;
        }

        .hero {
          gap: 24px;
          flex-wrap: wrap;
          justify-content: center;
        }

        .right-scene {
          margin-left: 0;
        }
      }

      @media (max-width: 800px) {
        .topbar {
          flex-wrap: wrap;
          gap: 14px;
          justify-content: center;
        }

        .logo {
          width: 230px;
          height: 58px;
          font-size: 2.4rem;
        }

        .top-actions {
          width: 100%;
          justify-content: center;
          flex-wrap: wrap;
        }

        .join-btn,
        .login-btn {
          min-width: 140px;
        }

        .center-copy {
          width: 100%;
          max-width: 420px;
        }

        .headline {
          font-size: 2.6rem;
        }

        .left-scene,
        .right-scene {
          transform: scale(0.9);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo">Blooket</div>

        <div class="top-actions">
          <button class="btn join-btn"><span class="play"></span>Join a game</button>
          <button class="btn login-btn">Log in</button>
        </div>
      </header>

      <main class="hero" aria-label="Blooket slogan area">
        <div class="left-scene" aria-hidden="true">
          <div class="board-shadow"></div>
          <div class="teacher">
            <div class="hat"></div>
            <div class="head"></div>
            <div class="glasses"></div>
            <div class="body"></div>
            <div class="arm"></div>
          </div>
          <div class="board">
            <div class="menu-strip"></div>
            <div class="board-tiles">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>
          </div>
        </div>

        <div class="center-copy">
          <h1 class="headline">Fun, free, educational<br />games for everyone!</h1>
          <button class="signup-btn">Sign up</button>
          <div class="pronounced">
            <span class="speaker"></span>
            <span>Pronounced (&quot;Blue-kit&quot;)</span>
          </div>
        </div>

        <div class="right-scene" aria-hidden="true">
          <div class="blook-row">
            <div class="blook">
              <div class="face">
                <span class="eye left"></span>
                <span class="eye right"></span>
              </div>
              <div class="body"></div>
              <div class="smile"></div>
            </div>
            <div class="blook">
              <div class="face">
                <span class="eye left"></span>
                <span class="eye right"></span>
              </div>
              <div class="body"></div>
              <div class="smile"></div>
            </div>
            <div class="blook">
              <div class="face">
                <span class="eye left"></span>
                <span class="eye right"></span>
              </div>
              <div class="body"></div>
              <div class="smile"></div>
            </div>
            <div class="blook">
              <div class="face">
                <span class="eye left"></span>
                <span class="eye right"></span>
              </div>
              <div class="body"></div>
              <div class="smile"></div>
            </div>
          </div>
          <div class="desk"></div>
        </div>
      </main>

      <div class="scroll-cue" aria-hidden="true">
        <div class="arrow"></div>
      </div>
    </div>
  </body>
</html>
